[tasks.build]
run = """. ./.env.prod && docker build \
  --build-arg SITE_URL="$SITE_URL" \
  --build-arg PUBLIC_UMAMI_HOST="$PUBLIC_UMAMI_HOST" \
  --build-arg UMAMI_WEBSITE_ID="$UMAMI_WEBSITE_ID" \
  --build-arg UMAMI_RECORDER_WEBSITE_ID="$UMAMI_RECORDER_WEBSITE_ID" \
  ."""

[tasks.deploy]
run = """. ./.env.prod && docker compose up -d --build"""
