name: crowsystems
services:
  app:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
        PUBLIC_UMAMI_HOST: ${PUBLIC_UMAMI_HOST:-}
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
        UMAMI_RECORDER_WEBSITE_ID: ${UMAMI_RECORDER_WEBSITE_ID:-}
    restart: unless-stopped
    expose:
      - 80
    env_file:
      - .env.prod
    networks:
      - app_network

  cloudflare:
    image: cloudflare/cloudflared:2026.8.3
    restart: unless-stopped
    volumes:
      - ./.cloudflare:/home/nonroot/.cloudflared
    command: tunnel run
    networks:
      - app_network

networks:
  app_network:

volumes:
  db_data:
