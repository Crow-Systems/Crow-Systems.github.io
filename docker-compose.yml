name: crowsystems
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - 80
    env_file:
      - .env.prod
    networks:
      - app_network

  cloudflare:
    image: cloudflare/cloudflared:2026.8.3
    restart: unless-stopped
    volumes:
      - ./.cloudflare:/home/nonroot/.cloudflared
    command: tunnel run
    networks:
      - app_network

networks:
  app_network:

volumes:
  db_data:
